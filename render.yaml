databases:
  - name: rewatch-db
    plan: free
    databaseName: rewatch_db
    user: rewatch

services:
  - type: web
    name: rewatch-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: rewatch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rewatch-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rewatch-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rewatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rewatch-db
          property: password
      # Secrets below are intentionally NOT stored in this file (sync: false
      # means "set by hand in the Render dashboard, never committed to git").
      - key: TMDB_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # sync: false, same as the secrets above — NOT because these are
      # secret, but because the live values (the real Vercel origin) were
      # set by hand in the Render dashboard and do not match what's
      # committed here. A `value:` here previously meant the next blueprint
      # sync (deliberate or accidental) would silently revert production
      # CORS to localhost-only and break the live site outright.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        value: ""
      # Render's edge proxy appends its own observed peer address to
      # X-Forwarded-For rather than overwriting it, and SecurityUtil.clientIp()
      # reads the rightmost entry specifically because of that — see its doc
      # comment. Safe to enable only under that append-not-overwrite topology;
      # without this, every request behind Render's proxy resolves to the same
      # internal address and all rate limits share one bucket.
      - key: TRUST_PROXY_HEADERS
        value: "true"
