<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#090a0e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A recommendation engine built on a real taste model, not popularity." />
    <title>Re:Watch — Stories chosen for how you feel</title>

    <!-- Open Graph / Twitter Card — controls how a shared link previews on
         social platforms, group chats, and Discord. og:url and og:image use
         a root-relative path: replace with the full production URL (e.g.
         https://rewatch.app/og-image.png) once a domain is live — some
         crawlers (notably Facebook's) don't reliably resolve relative
         og:image URLs against the page origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Re:Watch" />
    <meta property="og:title" content="Re:Watch — Stories chosen for how you feel" />
    <meta property="og:description" content="A recommendation engine built on a real taste model, not popularity." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Re:Watch — Stories chosen for how you feel" />
    <meta name="twitter:description" content="A recommendation engine built on a real taste model, not popularity." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
