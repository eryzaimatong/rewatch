server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Spring already sets its own equivalents API-side; these cover the
    # static frontend nginx serves directly, which had none.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # connect-src is intentionally 'self' https: rather than pinned to the
    # exact API origin — VITE_API_BASE (and therefore the real backend
    # domain) is only known at frontend *build* time (see Dockerfile), and
    # this file is copied in unmodified with no env substitution, so it has
    # no way to know that value. Pinning it to a guess risks silently
    # breaking every API call in a deployment that doesn't match. Everything
    # else here is fixed regardless of deployment topology, so it's locked
    # down for real: no inline/eval script, no plugins, no framing.
    # Operators deploying to a fixed, known API domain should tighten
    # connect-src to that exact origin instead of https:.
    # style-src/font-src include fonts.g{oogleapis,static}.com for the Plus
    # Jakarta Sans @import in App.css — googleapis.com serves the stylesheet,
    # gstatic.com serves the actual woff2 files it points at; without both,
    # this CSP would silently drop the whole app back to system fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://image.tmdb.org data:; connect-src 'self' https:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Vite fingerprints every built asset (app-<hash>.js), so an asset's
    # content never changes without its URL also changing — safe to cache
    # forever. index.html is the one file whose content changes without its
    # URL changing (it's what points at the current hashed assets), so it's
    # explicitly excluded and must always be revalidated or a deploy would
    # leave returning visitors on old JS indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: react-router owns client-side routes like /social/:id,
    # so any path nginx can't find as a static file goes to index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
