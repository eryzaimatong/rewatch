server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router owns client-side routes like /social/:id,
    # so any path nginx can't find as a static file goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
