# Activated via SPRING_PROFILES_ACTIVE=prod. Overrides the insecure dev
# defaults in application.properties with required (no-fallback) env vars —
# Spring refuses to start if any of these are unset, rather than silently
# running with a known secret or a wide-open schema migration.
jwt.secret=${JWT_SECRET}
rewatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
rewatch.frontend.base-url=${FRONTEND_BASE_URL}

# Still `update`, not `validate`, even though Flyway now exists (see
# db/migration/V1__baseline.sql) — flipping to strict validation needs a
# baseline DDL verified against the actual live schema first, and this
# environment has no way to test that against a real Postgres instance
# before shipping it. `update` staying on is a deliberate, temporary choice,
# not the old "no tooling at all" gap.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
