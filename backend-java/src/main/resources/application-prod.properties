# Activated via SPRING_PROFILES_ACTIVE=prod. Overrides the insecure dev
# defaults in application.properties with required (no-fallback) env vars —
# Spring refuses to start if any of these are unset, rather than silently
# running with a known secret or a wide-open schema migration.
jwt.secret=${JWT_SECRET}
rewatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
rewatch.frontend.base-url=${FRONTEND_BASE_URL}

# Strict: Hibernate checks the live schema against the entities at boot and
# refuses to start on a mismatch, instead of silently ALTERing production.
# Verified before flipping: all 21 live tables have column-for-column the same
# names, types, nullability and lengths as the schema Hibernate builds from
# the entities, and a boot with `validate` against that schema starts cleanly
# (backend-java/scripts/verify-schema.sh repeats that check in CI).
#
# What this means in practice:
#  - Every future schema change needs its own Flyway migration (V4__*.sql, ...)
#    deployed before or with the entity change. `update` used to add the column
#    for you; `validate` will instead refuse to boot, by design.
#  - A brand-new empty database will not boot under `validate` (V1 is a no-op
#    baseline). For disaster recovery set JPA_DDL_AUTO=update for ONE boot, then
#    put it back. Same switch is the emergency override for a bad deploy.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
