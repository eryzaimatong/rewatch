# Local overrides (secrets, personal DB creds) live here and are gitignored.
spring.config.import=optional:file:./application-local.properties

# Railway (and most PaaS hosts) assign a dynamic port via $PORT and route
# traffic to it; the Dockerfile's EXPOSE 8080 alone doesn't satisfy that.
# Falls back to 8080 for docker-compose/local, where nothing sets $PORT.
server.port=${PORT:8080}

# sslmode defaults to "prefer" (pgjdbc's own default, so this changes nothing
# for Render/local) — Neon requires SSL, so the prod deploy sets DB_SSLMODE=
# require via the dashboard. Deliberately NOT adding Neon's channel_binding
# param here: pgjdbc's exact support/spelling for it isn't something this
# environment could verify against a real connection, and sslmode=require
# alone is sufficient for an encrypted connection.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rewatch_db}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Postgres itself had no statement_timeout — a single runaway query (a
# missing index under load, a lock wait) could hold a HikariCP connection
# open indefinitely, and on this free-tier pool (a handful of connections
# at most) a few stuck queries starve every other request. 30s is well
# above any real query this app runs and well below the frontend's 180s
# fetch budget (sessionGuard.js), so the database — not the client —
# is what gives up first and returns a clean, recoverable error instead
# of the request hanging until the browser's own timeout fires.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 30000

# Explicit rather than relying on Hikari's own default (which is also 10,
# but stating it makes the ceiling a deliberate choice, not an accident).
# Neon's DIRECT endpoint (not the pooled one — see DEPLOYMENT.md for why)
# reports max_connections=104 at the free tier's minimum 0.25 CU compute,
# scaling up to 839 as it autoscales. A single Render instance with a pool
# of 10 uses under 10% of the connection ceiling even at the smallest size,
# so this has wide headroom without needing PgBouncer pooling at this scale.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# See db/migration/V1__baseline.sql for why this coexists with ddl-auto=update
# instead of replacing it. baseline-version MUST match V1's own version
# number, not 0 — baseline-on-migrate marks the existing database as already
# being at baseline-version and only runs migrations numbered *above* that,
# so baseline-version=1 is what actually makes V1 inert against a database
# that already has tables (every environment today). Getting this off-by-one
# wrong (baseline-version=0) would have made Flyway genuinely execute V1
# against production on first boot instead of just stamping it as applied —
# harmless here since V1 is a no-op `select 1`, but wrong is still wrong.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY:}
# How long TmdbClient's @Cacheable results (popular/trending/topRated/discover*)
# are served before a fresh TMDB call is made — see config/TmdbCacheManager.
tmdb.cache.ttl-minutes=${TMDB_CACHE_TTL_MINUTES:30}
tmdb.connect-timeout-ms=3000
tmdb.read-timeout-ms=5000

# Allowed browser origins for the SPA (comma separated)
rewatch.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Match-score calibration. anchor = mean affinity for a typical profile against the
# catalog; slope = points per unit of affinity (~22 pts/stdev at slope=440). Re-fit
# from GET /api/admin/feature-stats whenever the lexicon changes materially.
rewatch.scoring.anchor=0.80
rewatch.scoring.slope=440.0

# JWT signing secret (HS256, needs >=256 bits) and token lifetime. The fallback
# below is fine for local dev only. It's not reachable in prod: the `prod`
# profile (application-prod.properties, activated by SPRING_PROFILES_ACTIVE=prod
# in the Docker image) requires JWT_SECRET with no fallback, so a real deploy
# refuses to boot on the dev secret rather than silently using it.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-01234567890123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Which EmailSender bean is active (see EmailConfig) — "smtp" (default) or
# "http" (Resend, once RESEND_API_KEY is actually provisioned; see
# HttpEmailSender's doc comment: built and unit-tested against a mocked
# client, but UNVERIFIED against a real Resend account — none has ever
# existed for this app). Stays "smtp" here on purpose even though SMTP is
# confirmed broken on the current deploy host (see below) — flipping this
# default to "http" without a real RESEND_API_KEY set would trade a known,
# gracefully-degrading failure mode for a boot-time crash (EmailConfig's
# httpEmailSender() bean has no fallback for that property, by design).
# Switch this to "http" and set RESEND_API_KEY once that key exists.
rewatch.mail.provider=smtp
resend.api-key=${RESEND_API_KEY:}

# Password-reset email, via Gmail SMTP. MAIL_USERNAME/MAIL_PASSWORD are a Gmail
# address + App Password (not the account password) — set them in
# application-local.properties for local dev, same pattern as everything else here.
#
# KNOWN BROKEN on the current Render free-tier deployment: confirmed live that
# both 587 (STARTTLS) and 465 (implicit TLS) hit java.net.SocketTimeoutException
# — Render's free web-service tier blocks outbound SMTP entirely (a common
# free-tier restriction against spam abuse), not a port-specific or code issue.
# No email actually sends right now — password-reset and new-follower emails
# both silently fail into a FAILED EmailDeliveryRecord + an ERROR log with a
# correlation id (EmailService), while the request itself still succeeds
# cleanly (see the timeout comment below for why that failure needed a
# timeout to ever actually surface instead of hanging). The real fix is
# switching rewatch.mail.provider to "http" above once RESEND_API_KEY exists.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JavaMail's own default is no timeout at all — confirmed live: a
# forgot-password request against the real deployed backend hung well past
# a minute with zero response, because the request thread was blocked
# inside mailSender.send() waiting on a TCP connection that never resolved
# (a free-tier host blocking outbound SMTP, a transient DNS/network issue —
# either way, indefinitely). PasswordResetService.requestReset() already
# catches and logs a send failure without breaking its own contract, but
# that catch block is worthless if the call never actually throws — it
# just hangs. These bound every phase (connect/read/write) so a broken
# mail path fails in seconds, not never, and the frontend's "Sending..."
# button actually resolves either way.
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
rewatch.mail.from=${MAIL_FROM:${spring.mail.username}}

# The single canonical origin the SPA is served from — used to build the
# reset-password link embedded in the email. Distinct from
# rewatch.cors.allowed-origins above (a list, for CORS matching): this is one
# concrete URL, not a set of allowed values.
rewatch.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Comma-separated emails auto-promoted to ADMIN on login (see AuthController).
# Empty means nobody is an admin — a safe default, not a missing feature.
rewatch.admin.emails=${ADMIN_EMAILS:}

# Whether SecurityUtil.clientIp() (used for rate-limiting auth endpoints) trusts
# the X-Forwarded-For header. Off by default: it's a plain client-settable
# header, so trusting it unconditionally lets an attacker rotate it per request
# and bypass every rate limit. Only enable when this app is deployed behind a
# reverse proxy/load balancer that overwrites (not appends to) any
# client-supplied X-Forwarded-For before forwarding.
rewatch.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
